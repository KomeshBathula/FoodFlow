version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: foodflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: foodflow-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: foodflow-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/foodflow
      - REDIS_URI=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - redis

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: foodflow-ai
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: foodflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
